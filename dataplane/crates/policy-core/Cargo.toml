[package]
name = "policy-core"   # the one naming exception to the ds- prefix (doc 14 §6)
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The ds-contracts path dep — anticipated in doc 14 §6 ("the ds-contracts dep
# arrives when a consumer wires provenance through"): POL-1 v0 lands the schema
# types + parse-time validators in ds-contracts (doc 13 §1 rule 1, §3), and this
# crate is the evaluator that consumes them for the §7 parse→evaluate round-trip
# (compose layers with deny-overrides, capability-gate inertness). ds-contracts
# is itself stdlib-only, so this dep pulls NO framework crate across the seam.
# NEVER hickory or pingora types in this crate's API (D67/D40).
ds-contracts = { path = "../ds-contracts" }
