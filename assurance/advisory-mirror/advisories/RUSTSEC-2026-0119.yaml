# Seed mirrored-advisory test spec — RUSTSEC-2026-0119 (compression bomb).
#
# SPEC/FIXTURE ONLY. The ds-dnsgate crate this wires into does not exist yet; this is a
# ready-to-wire descriptor for the ds-dnsgate regression corpus (doc 11 §6 obligation 8).
# No D-number is minted here.

advisory: RUSTSEC-2026-0119
summary: >-
  A crafted message exploiting DNS name compression (a "compression bomb") expands to a
  disproportionate amount of work/memory during decoding, exhausting the resolver.
affected:
  crate: hickory-dns
  pin: "0.26.x"
  subscription: hickory-dns          # subscriptions.yaml id
class: resource-exhaustion / compression-bomb-encoding

# The structured input the reproduction feeds the resolver. Fixture SHAPE, not raw bytes —
# the concrete fixture is synthetic and lands with the corpus (D50: a fixture in git is synthetic).
input_shape:
  transport: [udp, tcp]              # re-run over TCP for §3.4 TCP parity (doc 11 §6 obligation 6)
  malformed_message:
    kind: "DNS name compression pointers"
    property: >-
      pointer chains and/or overlapping compression offsets crafted so naive decoding
      expands to far more work than the wire length suggests
    edges:
      - "oversized names"
      - "compression loops"           # pointer cycles
      - "truncation edges"
    note: >-
      this is a member of the malformed-query fuzz corpus (oversized names, compression
      loops, truncation edges) that gates DNS-5 (doc 11 §6 obligation 8)

# What the PATCHED resolver must do — the assertion.
expected_behavior:
  - "name decoding is bounded — compression pointers cannot expand work/memory disproportionately"
  - "pointer cycles are detected and rejected, never followed indefinitely"
  - "the malformed message is rejected; no answer derived from it reaches the VM (W1 fail-closed)"

# The wire-observable verdict the conformance suite checks (driven via dig / stub clients,
# never a hickory API — doc 11 §6 obligation 10).
expected_verdict:
  rcode: SERVFAIL                    # genuine-failure rcode for a decode failure (§3.2, not a policy verdict)
  within_ms: 500                     # bounded work — no exhaustion stall
  residue: none                      # no map entry, no nft set element left behind (W1)
  resource_bound: "per-query decode work bounded; no fleet-resolver exhaustion under the reproduction"

suite_destination: [a, c]
suite_destination_detail:
  a: "ds-dnsgate (a) parsing/decoding regression — the reproduction the pinned resolver must survive"
  c: >-
    (c) guardrail-assurance — asserts the advertised property: no compression-bomb message can
    exhaust the fleet's only resolver (availability)

corpus_target:
  name: "ds-dnsgate regression corpus"
  status: landed                     # the ds-dnsgate crate landed; the reproduction is wired (see mirrored_test)
  obligation: "doc 11 §6 obligation 8 (gates DNS-5) + obligation 10 (wire-driven, not API-driven)"

# Back-link to the landed wire-driven reproduction (the corpus is no longer
# destination-less). The compression-bomb is sent as raw malformed bytes (a
# self-referential compression-pointer cycle) directly to the gate's wire parser — a
# stub client over the wire, never a hickory API (doc 11 §6 obligation 10) — and the
# bounded-work/no-exhaustion property above is the spec it enforces.
mirrored_test:
  - file: "dataplane/services/ds-dnsgate/tests/framework_validation.rs"
    test: "rustsec_2026_0119_compression_bomb_bounded"
    asserts: "pointer-cycle compression bomb rejected in bounded time; gate stays live (no exhaustion)"

citation:
  - "doc 14 §9 hickory-dns row: 'RUSTSEC-2026-0119 (compression bomb) seed the regression corpus'"
  - "doc 11 §6 obligation 8: 'RUSTSEC-2026-0119 (compression-bomb encoding) reproductions run against the pinned hickory; malformed-query fuzz corpus ... gates DNS-5'"
  - "doc 11 §7: hickory is the fleet's only resolver — an unpatched parsing/encoding-DoS window is a fleet availability incident"
