  - glob: "assurance/e2e/**"
    tags: []

  # ── TLS-3 conformance adapter (D17/D82; doc 12 §3; doc 09 §5 TLS-3) ──────────
  # assurance/conformance-adapter/tlsproxyinspect/ wires the real ds-tlsproxy
