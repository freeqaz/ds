<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- serpent-share DEMO UI: a shared Claude Code session (D141). Two browsers,
     one shared stdin, broadcast output. Imperfect interleaving is ACCEPTED. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serpent-share — shared Claude Code (DEMO, D141)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 8px 12px; background: #161b22; border-bottom: 1px solid #30363d;
             display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    #me { padding: 1px 8px; border-radius: 10px; background: #1f6feb; color: #fff; font-weight: 600; }
    #status { color: #8b949e; }
    .note { color: #d29922; font-size: 12px; }
    #out { flex: 1; overflow-y: auto; padding: 10px 12px; margin: 0; white-space: pre-wrap;
           word-break: break-word; }
    .ev { margin: 2px 0; }
    .role-user { color: #58a6ff; }
    .role-assistant { color: #c9d1d9; }
    .author { color: #f778ba; font-weight: 600; }
    .meta { color: #6e7681; font-size: 12px; }
    .err { color: #f85149; }
    footer { display: flex; gap: 8px; padding: 8px 12px; background: #161b22; border-top: 1px solid #30363d; }
    #in { flex: 1; padding: 6px 8px; background: #0d1117; color: #c9d1d9;
          border: 1px solid #30363d; border-radius: 6px; font: inherit; }
    button { padding: 6px 14px; background: #238636; color: #fff; border: 0; border-radius: 6px;
             font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { background: #30363d; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>serpent-share</h1>
    <span>you are <span id="me">?</span></span>
    <span id="status">connecting…</span>
    <span class="note">DEMO (D141): both keyboards → one shared Claude stdin; interleaving is imperfect by design.</span>
  </header>
  <pre id="out"></pre>
  <footer>
    <input id="in" placeholder="type a line and press Enter — every connected browser shares this stdin" autocomplete="off" autofocus>
    <button id="send" disabled>Send</button>
  </footer>

  <script>
    const out = document.getElementById('out');
    const inEl = document.getElementById('in');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const meEl = document.getElementById('me');

    function line(html, cls) {
      const div = document.createElement('div');
      div.className = 'ev' + (cls ? ' ' + cls : '');
      div.innerHTML = html;
      out.appendChild(div);
      out.scrollTop = out.scrollHeight;
    }
    function esc(s) {
      return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/ws');

    ws.onopen = () => {
      statusEl.textContent = 'connected';
      sendBtn.disabled = false;
      inEl.focus();
    };
    ws.onclose = () => {
      statusEl.textContent = 'disconnected';
      sendBtn.disabled = true;
      line('<span class="meta">— connection closed —</span>');
    };
    ws.onerror = () => { statusEl.textContent = 'error'; };

    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      switch (m.kind) {
        case 'hello':
          meEl.textContent = m.label;
          line('<span class="meta">you are author [' + esc(m.label) + ']. Every browser shares one Claude stdin.</span>');
          break;
        case 'event':
          renderEvent(m.event);
          break;
        case 'closed':
          line('<span class="meta">— Claude session ended —</span>');
          break;
        case 'error':
          line('<span class="err">error: ' + esc(m.text) + '</span>');
          break;
      }
    };

    function renderEvent(ev) {
      if (!ev) return;
      if (ev.type === 'chat.message' && ev.chat_message) {
        const cm = ev.chat_message;
        const role = cm.role || 'assistant';
        const blocks = (cm.blocks || []).filter(b => b.kind === 'text').map(b => b.text).join('');
        if (!blocks) return;
        // Surface the author tag we prepend to user input, e.g. "[A] hello".
        let body = esc(blocks);
        body = body.replace(/^(\[[^\]]+\])\s/, '<span class="author">$1</span> ');
        line('<span class="role-' + esc(role) + '">' + (role === 'user' ? '» ' : '') + body + '</span>',
             'role-' + role);
      } else if (ev.type === 'session.init') {
        line('<span class="meta">session.init — model ' + esc((ev.session_init||{}).model || '?') + '</span>');
      } else if (ev.type === 'session.accounted') {
        line('<span class="meta">— turn complete —</span>');
      } else {
        line('<span class="meta">' + esc(ev.type) + '</span>');
      }
    }

    function send() {
      const text = inEl.value;
      if (!text.trim() || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text }));
      inEl.value = '';
      inEl.focus();
    }
    sendBtn.onclick = send;
    inEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
  </script>
</body>
</html>
