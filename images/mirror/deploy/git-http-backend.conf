# git-http-backend.conf — read-only export config for the host-local mirror.
#
# Consumed by deploy/ds-mirror-serve.container: these env vars configure stock
# `git http-backend` (CGI) so the serve face is structurally PULL-ONLY.
#
# Read-only is enforced per-verb: only the fetch path (git-upload-pack / smart
# GET) is reachable; git-receive-pack (push) is never exported. There is no
# auth and no push endpoint — the listener is host-loopback only and the VMs
# reach it on their host-local gateway address (see ds-mirror.env).

# Export every bare mirror under the project root without per-repo
# git-daemon-export-ok marker files. Safe here because the whole tree is
# already-public mirror data and the bind is loopback-only.
GIT_HTTP_EXPORT_ALL=1

# The directory git-http-backend serves. Must match DS_MIRROR_ROOT in
# ds-mirror.env and the volume mount in ds-mirror-serve.container.
GIT_PROJECT_ROOT=/srv/git

# Disable the push verb at the protocol layer. With http.receivepack unset
# (default off for anonymous), receive-pack is already refused; we assert it
# explicitly so a config drift cannot silently enable push.
GIT_HTTP_RECEIVE_PACK=0
