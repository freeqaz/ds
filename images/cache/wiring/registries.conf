# registries.conf — containers/image (podman/buildah/skopeo) wiring for the
# site-local OCI cache (D41).
#
# Golden images (../../golden/) bake this as /etc/containers/registries.conf so
# every session's container pulls resolve through the pull-through cache.
# Docker Hub (registry-1.docker.io) is reached ONLY on a cache miss, by the
# cache host — never by the session VM directly. Nexus proxies; it implements
# no registry semantics (D41).
#
# Connector port matches deploy/repos.yaml (docker-proxy) and
# deploy/nexus.container :5000. `cache.ds.local` resolves in-VM to the cache host
# through the egress boundary allow-set (ds-dnsgate / ds-tlsproxy, D63).

# Pull docker.io through the host-local mirror, mirror-only (no VM-direct
# fallback to the upstream — a miss is the cache's job to fetch, keeping the
# boundary's registry allow-set authoritative).
[[registry]]
prefix = "docker.io"
location = "registry-1.docker.io"

[[registry.mirror]]
location = "cache.ds.local:5000"

# The in-VM hop is plain HTTP to a host-local endpoint behind the boundary; the
# cache terminates upstream TLS. Mark the mirror insecure so the plaintext
# host-local hop is accepted (the boundary, not TLS, is the in-VM trust edge).
[[registry]]
location = "cache.ds.local:5000"
insecure = true

# Additional upstreams (ghcr.io, quay.io) need their own docker proxy repo on a
# distinct connector port (see deploy/repos.yaml notes) plus a matching
# [[registry]] / [[registry.mirror]] pair here. One mirror endpoint fronts one
# upstream; do not point two prefixes at the same :5000 connector.

# --- ghcr.io (GitHub Container Registry) -----------------------------------
# DISABLED BY DEFAULT. No golden image (../../golden/) currently pulls from
# ghcr.io. To enable: uncomment both stanzas below, uncomment the ghcr-proxy
# repo in deploy/repos.yaml, and add the matching create_proxy in
# deploy/bootstrap.sh — all three must agree on connector port :5001 (distinct
# from :5000 Docker Hub and :5002 quay.io). Mirror-only, no VM-direct fallback,
# same shape as the docker.io block above.
# [[registry]]
# prefix = "ghcr.io"
# location = "ghcr.io"
#
# [[registry.mirror]]
# location = "cache.ds.local:5001"
#
# [[registry]]
# location = "cache.ds.local:5001"
# insecure = true

# --- quay.io ---------------------------------------------------------------
# DISABLED BY DEFAULT. No golden image (../../golden/) currently pulls from
# quay.io. To enable: uncomment both stanzas below, uncomment the quay-proxy
# repo in deploy/repos.yaml, and add the matching create_proxy in
# deploy/bootstrap.sh — all three must agree on connector port :5002 (distinct
# from :5000 Docker Hub and :5001 ghcr.io). Mirror-only, no VM-direct fallback,
# same shape as the docker.io block above.
# [[registry]]
# prefix = "quay.io"
# location = "quay.io"
#
# [[registry.mirror]]
# location = "cache.ds.local:5002"
#
# [[registry]]
# location = "cache.ds.local:5002"
# insecure = true
