# pip.conf — pip client wiring for the site-local cache (D41).
#
# Golden images (../../golden/) bake this as /etc/pip.conf so every session
# resolves PyPI through the pull-through cache. pypi.org is reached ONLY on a
# cache miss, by the cache host — never by the session VM directly. Nexus
# proxies; it implements no registry semantics (D41).
#
# index-url is the PEP 503 simple API child of the pypi-proxy endpoint declared
# in deploy/repos.yaml; host/port match deploy/nexus.container :8081.
# `cache.ds.local` resolves in-VM to the cache host through the egress boundary
# allow-set (ds-dnsgate / ds-tlsproxy, D63).

[global]
index-url = http://cache.ds.local:8081/repository/pypi-proxy/simple/

# The in-VM hop is plain HTTP to a host-local endpoint behind the boundary;
# the cache terminates upstream TLS. Mark the cache host trusted so pip does
# not reject the plaintext host-local hop.
trusted-host = cache.ds.local

# Modest retry so a cold-cache first pull (which triggers an upstream fetch)
# does not fail on a transient upstream blip.
retries = 2
timeout = 30
