# SPDX-License-Identifier: Apache-2.0
# .gitleaks.toml — gitleaks configuration for dream-serpent.
#
# Extends the default gitleaks ruleset and adds path-based allowlists to
# suppress the categories of false positive this repository produces:
#
#   1. boundary/ test files and dataplane Rust source files
#      The boundary spec (D26 — RED by design) and the dataplane workspace use
#      constructed synthetic GitHub-PAT-shaped tokens as adversarial/canary
#      inputs in unit tests. Examples:
#        - ghp_THISisAsyntheticTOKENnotReal00000000 (policy-core/tests/)
#        - ghp_LONGCANARY9aF3xQ7mZ2kW8pL1nV5rT0uY4s (flowlog_audit_test.go)
#        - ghp_0123456789abcdef0123456789abcdef0123  (tlsproxy_scan_test.go)
#        - ghp_canaryTOKEN0001 (ds-tlsproxy/src/scan.rs #[cfg(test)])
#        - ghp_LONGLIVEDsecretBEEFc0ffee… (ds-tlsproxy/src/swap.rs)
#        - ghp_DEADBEEFcanary (ds-telemetry/src/scrub.rs)
#      The ds-tlsproxy TLS-7 secret-scanning gate (D73) exercises the
#      hold-back buffer and canary hit path with synthetic tokens that
#      live in src/ inline #[cfg(test)] modules, not standalone test files.
#      These are intentional test data. A real leaked GitHub PAT would be
#      rotated immediately and never left named "CANARY" or "Synthetic".
#
# If a finding survives these allowlists (i.e. gitleaks fires on a PR that
# does not touch test files or synthetic fixtures), it should be treated as
# real and investigated before merging.

title = "dream-serpent gitleaks config"

[extend]
# Extend the default built-in ruleset rather than replacing it.
# All default rules (generic-api-key, github-pat, private-key, etc.) remain
# active; only the allowlist entries below suppress specific paths.
useDefault = true

[allowlist]
description = "Synthetic test tokens and deterministic proof fixtures"
paths = [
    # (1) Go test files in boundary/ — synthetic canary credential fixtures
    #     used as adversarial input in the boundary spec (D26, RED by design)
    #     and the flowlog/tlsproxy scan test suites.
    '''.+_test\.go''',

    # (2) Rust source files in the dataplane workspace (crates/ AND services/) —
    #     synthetic PAT-shaped tokens appear in both standalone tests/ harnesses
    #     AND inline #[cfg(test)] modules within src/*.rs files (ds-tlsproxy
    #     scan.rs, transparent.rs, swap.rs, telemetry_http.rs, main.rs;
    #     ds-telemetry scrub.rs, event.rs, spool.rs; ds-contracts pol1/tests.rs;
    #     policy-core tests/). The original crates/.+/tests/ pattern missed the
    #     services/ tree and all src/ inline-test occurrences. The dataplane
    #     workspace never carries real credentials in Rust source; all ghp_*
    #     values here are synthetic adversarial canaries (confirmed by name:
    #     "CANARY", "seamCANARY", "PLANTED", "LONGLIVED", "DEADBEEF", etc.).
    '''dataplane/(crates|services)/.+\.rs''',

    # (3) client/goldentrace/ test cassettes/fixtures — the goldentrace e2e
    #     coverage corpus (e.g. e2e/testdata/coverage.jsonl) embeds synthetic
    #     proof tokens like "COV-PLAN-9X4T"/"COV-GLOB-9X4T"/"COV-GREP-9X4T" that
    #     the headless-drive harness greps for to prove a turn ran. They are
    #     deterministic test markers, not credentials; generic-api-key fires on
    #     the "Token: <ID>" shape. Golden testdata never carries real secrets.
    '''client/goldentrace/.+/testdata/.+''',

    # (4) scripts/live-mvp/ demo+proof harnesses — the live-MVP drive scripts
    #     (e.g. ds-test-cc-drive.sh) define a synthetic PROOF_TOKEN
    #     ("DS-HEADLESS-PROOF-7Q2K") echoed inside the VM and read back to prove
    #     a driven side effect. A proof sentinel, not a credential.
    '''scripts/live-mvp/.+''',
]
