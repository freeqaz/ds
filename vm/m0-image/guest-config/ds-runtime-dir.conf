# /run/ds — the M0 guest attach-plane runtime directory (gap-3).
#
# /run is tmpfs, recreated EMPTY on every boot, so /run/ds must be materialized
# before any attach-plane unit touches it:
#   - ds-attachfwd.service binds its guest-local UDS at /run/ds/attach.sock, and
#   - run-ds-entrypoint.mount mounts the per-session config-drive at /run/ds/entrypoint.
# ds-attachfwd is ordered Before=ds-entrypoint.service in PARALLEL with the mount,
# and the mount only creates /run/ds when a config-drive is actually attached — so
# without this drop-in ds-attachfwd RACES the mount and crash-loops on the absent
# directory (live-found on the KVM box 2026-06-16: "carriage up" only after /run/ds
# existed). systemd-tmpfiles runs early at boot, so this guarantees /run/ds exists,
# owned by the unprivileged ds user, before any attach-plane unit starts.
#
# SPDX-License-Identifier: Apache-2.0
d /run/ds 0755 ds ds -
