# 99-ds-disable-ipv6.conf — D75 guest-interior IPv6 posture, baked into the M0
# base image at /etc/sysctl.d/99-ds-disable-ipv6.conf.
#
# D75 (doc 04 §6; doc 11 §3.5): v0 / Phase-B guests are v4-only. The golden
# image disables v6 via PER-INTERFACE sysctl on the EGRESS NIC(s) only — `lo`
# keeps `::1`, and the kernel `ipv6.disable=1` cmdline param is FORBIDDEN
# (it breaks Docker 28.x inside the guest). ds-dnsgate already answers AAAA
# with NODATA so a v4-only guest never resolves a v6 target (doc 11 §3.3);
# this drop-in is the in-guest belt to that suspenders: even a hard-coded v6
# literal cannot leave the guest's egress NIC.
#
# This is the GUEST-INTERIOR half. The HOST-NETNS side of every per-session tap
# (`disable_ipv6=1` + `accept_ra=0` on the host-side tap, no RA/DHCPv6 on the
# per-session bridge/tap segment) is the Boundary-owned host-baseline artifact
# (dataplane/artifacts/host-baseline/, D75), a different artifact for a
# different netns — the two are complementary, never the same file.
#
# Per-interface, not net.ipv6.conf.all: M0's guest egress NIC is enumerated
# `enp*`/`ens*`/`eth*` by the virtio-net driver depending on host/predictable-
# names. The build (build-m0-image.sh) expands M0_EGRESS_NIC_GLOB to the
# concrete `net.ipv6.conf.<ifname>.*` keys at bake time, because sysctl.d does
# not glob interface names. The lines below are the TEMPLATE the build expands;
# `__IFACE__` is substituted per matched egress interface. `lo` is never
# touched, so `::1` survives for loopback-only guest services.
#
# SPDX-License-Identifier: Apache-2.0

# Disable IPv6 address autoconfig and drop any existing v6 addresses on the
# egress NIC. accept_ra=0 refuses router advertisements; disable_ipv6=1 tears
# the v6 stack down on this interface only.
net.ipv6.conf.__IFACE__.disable_ipv6 = 1
net.ipv6.conf.__IFACE__.accept_ra = 0
net.ipv6.conf.__IFACE__.autoconf = 0
